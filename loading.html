<!DOCTYPE html>
<!--
    RedIceGaming - Ladescreen (sv_loadingurl)

    Gleicher Look wie das Join-Intro (swrp_intro.lua): Sternenfeld, HUD-Ecken, Emblem,
    Holo-Terminal. Wenn GMod das Client-Lua startet, blenden Logo und Terminal aus und
    es bleibt exakt die Szene stehen, mit der die Lua-Abdeckung und danach das Intro
    beginnen ("NAV-COMPUTER · STANDBY"). So gibt es keinen sichtbaren Bruch.

    Einbinden (server.cfg):
        sv_loadingurl "https://DEINE-SEITE/loading.html?map=%m&steamid=%s"

    Vorschau im Browser:  loading.html?demo=1
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>RedIceGaming</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;800;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: #03060e; color: #e1e8f0;
        font-family: "Roboto", "Segoe UI", Arial, sans-serif;
        -webkit-user-select: none; user-select: none; cursor: default;
    }
    /* Ebenen: Nebel -> Sterne -> Vignette -> Inhalt -> HUD */
    #nebula, #stars, #vignette, #content, #hud { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
    #nebula {
        background:
            radial-gradient(ellipse 45vw 35vh at 50% 30%,
                rgba(20,45,95,0.14) 0%, rgba(20,45,95,0.10) 25%, rgba(20,45,95,0.042) 50%, rgba(20,45,95,0.009) 75%, rgba(20,45,95,0) 100%),
            radial-gradient(ellipse 80vw 70vh at 50% 42%,
                rgba(8,16,34,0.60) 0%, rgba(8,16,34,0.44) 25%, rgba(8,16,34,0.18) 50%, rgba(8,16,34,0.04) 75%, rgba(8,16,34,0) 100%);
    }
    #vignette {
        background: radial-gradient(ellipse 50vw 50vh at 50% 50%,
            rgba(0,0,0,0) 35%, rgba(0,0,0,0.13) 60%, rgba(0,0,0,0.46) 87.5%, rgba(0,0,0,0.62) 100%, rgba(0,0,0,0.92) 140%);
    }

    /* ---------- HUD (bleibt bis zum Schluss, identisch zum Intro) ---------- */
    .corner { position: absolute; width: 4.5vh; height: 4.5vh; }
    .corner::before, .corner::after {
        content: ""; position: absolute; background: rgba(0,150,255,0.27); border-radius: 1px;
    }
    .corner::before { width: 100%; height: 1.2px; }
    .corner::after  { width: 1.2px; height: 100%; }
    .c-tl { left: 4vh; top: 4vh; }
    .c-tr { right: 4vh; top: 4vh; transform: scaleX(-1); }
    .c-bl { left: 4vh; bottom: 4vh; transform: scaleY(-1); }
    .c-br { right: 4vh; bottom: 4vh; transform: scale(-1,-1); }
    .hudtext {
        position: absolute; font-family: "Roboto Mono", Consolas, monospace;
        font-size: 1.3vh; letter-spacing: 0.02em; line-height: 1.55; white-space: pre;
    }
    #hud-tl { left: 5.2vh; top: 5.2vh; }
    #hud-tr { right: 5.2vh; top: 5.2vh; text-align: right; color: rgba(120,135,155,0.59); }
    #hud-l1 { color: rgba(0,150,255,0.59); }
    #hud-l2 { color: rgba(120,135,155,0.59); }

    /* ---------- Inhalt (blendet am Ende aus) ---------- */
    #content { transition: opacity 1.2s ease; }
    #content.out { opacity: 0; }

    #emblem {
        position: absolute; left: 50%; top: 25.5vh;
        width: 47.84vh; height: 47.84vh; margin-left: -23.92vh; margin-top: -23.92vh;
        overflow: visible;
    }
    #emblem .ring { transform-origin: 0 0; animation: spin 90s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #emblem .core { animation: pulse 2.2s ease-in-out infinite; transform-origin: 0 0; }
    @keyframes pulse { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }

    #title {
        position: absolute; left: 0; right: 0; top: 41vh; text-align: center;
        font-weight: 800; font-size: 11.8vh; line-height: 1; letter-spacing: 1.2vh;
    }
    #title .red { color: #e63741; }
    #title .ice { color: #a0dcff; }
    #sub {
        position: absolute; left: 0; right: 0; top: 53vh; text-align: center;
        font-weight: 500; font-size: 2.6vh; letter-spacing: 2.4vh; text-indent: 2.4vh; color: #e1e8f0;
    }
    #divider { position: absolute; left: 50%; top: 58.6vh; width: 22vw; margin-left: -11vw; height: 10px; }
    #divider .l, #divider .r { position: absolute; top: 4px; height: 1.2px; width: calc(50% - 10px);
        background: rgba(230,55,65,0.9); box-shadow: 0 0 6px rgba(230,55,65,0.5); }
    #divider .l { left: 0; } #divider .r { right: 0; }
    #divider .d { position: absolute; left: 50%; top: 1px; width: 6px; height: 6px; margin-left: -3px;
        background: #e63741; transform: rotate(45deg); border-radius: 1px; }
    #tagline {
        position: absolute; left: 0; right: 0; top: 60.6vh; text-align: center;
        font-size: 1.7vh; letter-spacing: 0.08em; color: #78879b;
    }

    #term {
        position: absolute; left: 50%; top: 69vh; transform: translateX(-50%);
        font-family: "Roboto Mono", Consolas, monospace; font-size: 1.75vh; line-height: 2.75vh;
        color: rgba(120,135,155,0.92);
    }
    #term .row { position: relative; padding-left: 2.2vh; white-space: pre; }
    #term .row::before {
        content: ""; position: absolute; left: 0; top: 50%; width: 0.6vh; height: 0.6vh; margin-top: -0.3vh;
        border-radius: 50%; background: #0096ff; box-shadow: 0 0 6px rgba(0,150,255,0.8);
    }
    #term .val { color: #e1e8f0; }
    #term .ok  { color: #46d278; }

    #bar {
        position: absolute; left: 50%; top: 86vh; width: 34vw; max-width: 600px; transform: translateX(-50%);
    }
    #bar .track { height: 4px; border-radius: 2px; background: rgba(120,135,155,0.18); position: relative; }
    #bar .fill  { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 2px;
        background: #0096ff; box-shadow: 0 0 10px rgba(0,150,255,0.7); transition: width 0.6s ease; }
    #bar .meta { display: flex; justify-content: space-between; margin-top: 1vh;
        font-family: "Roboto Mono", Consolas, monospace; font-size: 1.3vh; color: rgba(120,135,155,0.9); }
    #bar .pct { color: #0096ff; }
    #file {
        margin-top: 0.6vh; font-family: "Roboto Mono", Consolas, monospace; font-size: 1.15vh;
        color: rgba(120,135,155,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
    }
</style>
</head>
<body>
<div id="nebula"></div>
<canvas id="stars"></canvas>
<div id="vignette"></div>

<div id="content">
    <!-- Emblem: Eis-Kristall im Sechseck mit rotem Kern (wie im Intro) -->
    <svg id="emblem" viewBox="-130 -130 260 260">
        <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3.2" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <radialGradient id="aura">
                <stop offset="0" stop-color="#0096ff" stop-opacity="0.16"/>
                <stop offset="1" stop-color="#0096ff" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="coreglow">
                <stop offset="0" stop-color="#e63741" stop-opacity="0.45"/>
                <stop offset="1" stop-color="#e63741" stop-opacity="0"/>
            </radialGradient>
        </defs>
        <circle r="128" fill="url(#aura)"/>
        <g class="ring" stroke="#0096ff" fill="none">
            <circle r="65" stroke-opacity="0.38" stroke-width="1.4"/>
            <g id="ticks"></g>
        </g>
        <g filter="url(#glow)" stroke="#d2f0ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <polygon id="hex"/>
            <g id="spokes" stroke-width="2.2"></g>
        </g>
        <g class="core">
            <circle r="26" fill="url(#coreglow)"/>
            <rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="#e63741" rx="1"/>
            <rect x="-2.7" y="-2.7" width="5.4" height="5.4" transform="rotate(45)" fill="#ffbebe" opacity="0.8"/>
        </g>
    </svg>

    <div id="title"><span class="red">RED</span><span class="ice">ICE</span></div>
    <div id="sub">GAMING</div>
    <div id="divider"><div class="l"></div><div class="d"></div><div class="r"></div></div>
    <div id="tagline">CLONE WARS ROLEPLAY</div>

    <div id="term">
        <div class="row">HOLONET-VERBINDUNG  ······  <span id="t-conn" class="ok">AUFBAU…</span></div>
        <div class="row">SEKTOR  ··················  <span id="t-map" class="val">—</span></div>
        <div class="row">DATENPAKETE  ·············  <span id="t-files" class="val">—</span></div>
        <div class="row">STATUS  ··················  <span id="t-status" class="val">INITIALISIERE</span></div>
    </div>

    <div id="bar">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="meta"><span id="bar-label">SYNCHRONISIERE</span><span class="pct" id="pct">0 %</span></div>
        <div id="file"></div>
    </div>
</div>

<div id="hud">
    <div class="corner c-tl"></div><div class="corner c-tr"></div>
    <div class="corner c-bl"></div><div class="corner c-br"></div>
    <div class="hudtext" id="hud-tl"><div id="hud-l1">NAV-COMPUTER  ·  VERBINDUNG</div><div id="hud-l2">HOLONET WIRD ANGEFRAGT</div></div>
    <div class="hudtext" id="hud-tr">REDICEGAMING</div>
</div>

<script>
(function () {
    "use strict";

    // ---------------- Emblem aufbauen (Geometrie wie im Intro) ----------------
    var NS = "http://www.w3.org/2000/svg";
    var R = 50;
    function el(tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) { if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); }
        parent.appendChild(e); return e;
    }
    var hexPts = [];
    for (var i = 0; i < 6; i++) {
        var a = (-90 + i * 60) * Math.PI / 180;
        hexPts.push((Math.cos(a) * R).toFixed(2) + "," + (Math.sin(a) * R).toFixed(2));
    }
    document.getElementById("hex").setAttribute("points", hexPts.join(" "));
    var spokes = document.getElementById("spokes");
    for (i = 0; i < 6; i++) {
        var ang = (-90 + i * 60) * Math.PI / 180, dx = Math.cos(ang), dy = Math.sin(ang);
        el("line", { x1: dx * R * 0.16, y1: dy * R * 0.16, x2: dx * R * 0.68, y2: dy * R * 0.68 }, spokes);
        var bx = dx * R * 0.42, by = dy * R * 0.42, bl = R * 0.17;
        [-42, 42].forEach(function (off) {
            var ba = ang + off * Math.PI / 180;
            el("line", { x1: bx, y1: by, x2: bx + Math.cos(ba) * bl, y2: by + Math.sin(ba) * bl, "stroke-width": 1.8 }, spokes);
        });
    }
    var ticks = document.getElementById("ticks");
    for (i = 0; i < 24; i++) {
        var ta = (-90 + i * 15) * Math.PI / 180, major = (i % 6 === 0);
        var r1 = 65 + R * 0.06, r2 = 65 + R * (major ? 0.16 : 0.1);
        el("line", { x1: Math.cos(ta) * r1, y1: Math.sin(ta) * r1, x2: Math.cos(ta) * r2, y2: Math.sin(ta) * r2,
            "stroke-width": major ? 1.8 : 1.2, "stroke-opacity": major ? 0.67 : 0.35, "stroke-linecap": "round" }, ticks);
    }

    // ---------------- Sternenfeld (gleiche Parameter wie Intro bei t = 0) ----------------
    var cv = document.getElementById("stars"), ctx = cv.getContext("2d");
    var W = 0, H = 0, DPR = 1, stars = [], NUM = 380, SPEED = 0.10;
    function resize() {
        DPR = window.devicePixelRatio || 1;
        W = window.innerWidth; H = window.innerHeight;
        cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
        cv.style.width = W + "px"; cv.style.height = H + "px";
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    function reset(s, randomZ) {
        s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1;
        s.z = randomZ ? 0.05 + Math.random() * 0.95 : 1;
        s.b = 0.45 + Math.random() * 0.55;
        s.blue = Math.random() < 0.3;
    }
    for (i = 0; i < NUM; i++) { var s0 = {}; reset(s0, true); stars.push(s0); }

    var last = Date.now();
    function frame() {
        var now = Date.now(), dt = Math.min((now - last) / 1000, 0.1); last = now;
        ctx.clearRect(0, 0, W, H);
        var cx = W / 2, cy = H / 2, fov = W * 0.16;
        for (var j = 0; j < stars.length; j++) {
            var s = stars[j];
            s.z -= SPEED * dt;
            if (s.z <= 0.02) reset(s, false);
            var px = cx + s.x / s.z * fov, py = cy + s.y / s.z * fov;
            if (px < -60 || px > W + 60 || py < -60 || py > H + 60) { reset(s, false); continue; }
            var near = 1 - s.z;
            var a = Math.min(1, near * 1.4 * s.b);
            var d = (0.8 + near * 1.8) * 1.3;
            ctx.fillStyle = s.blue ? "rgba(185,215,255," + a.toFixed(3) + ")" : "rgba(255,255,255," + a.toFixed(3) + ")";
            ctx.beginPath(); ctx.arc(px, py, d / 2 + 0.3, 0, Math.PI * 2); ctx.fill();
        }
        requestAnimationFrame(frame);
    }
    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);

    // ---------------- Ladezustand ----------------
    var $ = function (id) { return document.getElementById(id); };
    var filesTotal = 0, filesNeeded = 0, stage = 0, finished = false, dots = 0, finishTimer = null;

    function setText(id, txt) { $(id).textContent = txt; }
    function setProgress(p) {
        p = Math.max(0, Math.min(1, p));
        $("fill").style.width = (p * 100).toFixed(1) + "%";
        setText("pct", Math.floor(p * 100) + " %");
        setText("bar-label", p >= 0.999 ? "SYNCHRONISIERT" : "SYNCHRONISIERE");
    }
    function update() {
        var fileP = filesTotal > 0 ? (filesTotal - filesNeeded) / filesTotal : 0;
        // Downloads fuellen den Bereich 15-60 %, danach uebernehmen die Statusstufen
        var p = Math.max(stage, filesTotal > 0 ? 0.15 + fileP * 0.45 : 0);
        setProgress(p);
        if (filesTotal > 0) setText("t-files", (filesTotal - filesNeeded) + " / " + filesTotal);
    }

    // Uebergang: Logo/Terminal aus, Szene bleibt -> identisch zur Lua-Abdeckung
    function finish() {
        if (finished) return;
        finished = true;
        stage = 1; update();
        setText("t-status", "BEREIT"); $("t-status").className = "ok";
        setTimeout(function () {
            $("content").className = "out";
            setText("hud-l1", "NAV-COMPUTER  ·  STANDBY");
        }, 400);
    }

    var STAGES = [
        ["retrieving server info", 0.05, "SERVERDATEN"],
        ["workshop",               0.15, "WORKSHOP"],
        ["downloading",            0.20, "DOWNLOAD"],
        ["mounting",               0.62, "ADDONS WERDEN EINGEBUNDEN"],
        ["sending client info",    0.74, "IDENTIFIKATION"],
        ["client info sent",       0.80, "IDENTIFIKATION OK"],
        ["requesting lua",         0.84, "LUA-DATEN"],
        ["lua",                    0.90, "LUA-DATEN"],
        ["parsing game info",      0.93, "SPIELDATEN"],
        ["starting lua",           0.97, "SYSTEMSTART"]
    ];

    // ---- Von GMod aufgerufene Funktionen ----
    window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode) {
        if (servername) setText("hud-tr", String(servername).toUpperCase());
        if (mapname) setText("t-map", String(mapname).toUpperCase());
        setText("t-conn", "AUFGEBAUT");
        setText("hud-l1", "NAV-COMPUTER  ·  ANFLUG");
        stage = Math.max(stage, 0.05); update();
    };
    window.SetFilesTotal = function (total) { filesTotal = Number(total) || 0; update(); };
    window.SetFilesNeeded = function (needed) { filesNeeded = Number(needed) || 0; update(); };
    window.DownloadingFile = function (fileName) {
        setText("file", String(fileName || ""));
        setText("t-status", "DOWNLOAD");
    };
    window.SetStatusChanged = function (status) {
        var st = String(status || "").toLowerCase();
        for (var k = 0; k < STAGES.length; k++) {
            if (st.indexOf(STAGES[k][0]) !== -1) {
                stage = Math.max(stage, STAGES[k][1]);
                setText("t-status", STAGES[k][2]);
            }
        }
        if (st.indexOf("starting lua") !== -1) finish();
        // Fallback, falls GMod keinen "Starting Lua"-Status meldet
        else if (stage >= 0.9 && !finishTimer) finishTimer = setTimeout(finish, 1500);
        update();
    };

    // Kartenname aus der URL (?map=%m), falls GameDetails spaet kommt
    var q = window.location.search;
    var mm = q.match(/[?&]map=([^&]+)/);
    if (mm) setText("t-map", decodeURIComponent(mm[1]).toUpperCase());

    // Animierte Punkte im HUD
    setInterval(function () {
        dots = (dots + 1) % 4;
        var base = finished ? "WARTE AUF FREIGABE" : ($("t-conn").textContent === "AUFGEBAUT" ? "DATENSTROM AKTIV" : "HOLONET WIRD ANGEFRAGT");
        setText("hud-l2", base + new Array(dots + 1).join("."));
    }, 500);

    // ---- Vorschau im Browser: ?demo=1 ----
    if (/[?&]demo=1/.test(q)) {
        var steps = [
            [300,  function () { GameDetails("RIG Testserver", "", "gm_construct", 4, "", "swrp"); }],
            [700,  function () { SetStatusChanged("Retrieving server info"); SetFilesTotal(240); SetFilesNeeded(240); }],
            [1200, function () { SetStatusChanged("Workshop Complete"); }]
        ];
        for (var n = 1; n <= 12; n++) {
            (function (n) { steps.push([1200 + n * 250, function () { SetFilesNeeded(240 - n * 20); DownloadingFile("materials/rig/textur_" + n + ".vtf"); }]); })(n);
        }
        steps.push([4600, function () { SetStatusChanged("Mounting Addons"); }]);
        steps.push([5400, function () { SetStatusChanged("Sending client info"); }]);
        steps.push([6200, function () { SetStatusChanged("Requesting Lua files"); }]);
        steps.push([7000, function () { SetStatusChanged("Starting Lua..."); }]);
        steps.forEach(function (s) { setTimeout(s[1], s[0]); });
    }
})();
</script>
</body>
</html>
